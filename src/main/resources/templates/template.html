<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"></meta>
    <title th:text="${Title}"></title>
</head>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        background-color: #e8e8e8;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }

    .card {
        background-color: #fff;
        border-radius: 8px;
        padding: 32px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    h3 { margin-top: 0; color: #333; }

    .badge {
        display: inline-block;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .badge.live   { background-color: #e6f4ea; color: #2e7d32; }
    .badge.cached { background-color: #fff3e0; color: #e65100; }

    label {
        display: block;
        margin: 12px 0 4px;
        font-size: 14px;
        color: #555;
        font-weight: bold;
    }

    select, input[type=text] {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 15px;
        background-color: #fafafa;
    }

    select:focus, input:focus {
        outline: none;
        border-color: #4CAF50;
    }

    button {
        width: 100%;
        background-color: #4CAF50;
        color: white;
        padding: 14px;
        margin-top: 20px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover { background-color: #45a049; }

    .updated {
        margin-top: 16px;
        font-size: 11px;
        color: #999;
        text-align: center;
    }
</style>
<body>
<div class="card">
    <h3 th:text="${Title}"></h3>

    <span th:if="${usingLiveRates}" class="badge live">● Live Rates</span>
    <span th:unless="${usingLiveRates}" class="badge cached">⚠ Using Cached Rates</span>

    <form method="get" action="/currency-conversion">
        <label for="from">Convert From:</label>
        <select id="from" name="from">
            <option th:each="currency : ${currencies}"
                    th:text="${currency.getName()}"
                    th:value="${currency.getName()}"/>
        </select>

        <label for="to">Convert To:</label>
        <select id="to" name="to">
            <option th:each="currency : ${currencies}"
                    th:text="${currency.getName()}"
                    th:value="${currency.getName()}"/>
        </select>

        <label for="amount">Amount:</label>
        <input type="text" id="amount" name="amount" placeholder="Enter amount..."/>

        <button type="submit">Convert</button>
    </form>

    <p class="updated" th:text="'Rates last updated: ' + ${lastUpdated}"></p>
</div>
</body>
</html>

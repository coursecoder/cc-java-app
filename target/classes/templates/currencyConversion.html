<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"></meta>
    <title th:text="${Title}"></title>
</head>
<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        background-color: #e8e8e8;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }

    .card {
        background-color: #fff;
        border-radius: 8px;
        padding: 32px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        text-align: center;
    }

    h3 { margin-top: 0; color: #333; }

    .badge {
        display: inline-block;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .badge.live   { background-color: #e6f4ea; color: #2e7d32; }
    .badge.cached { background-color: #fff3e0; color: #e65100; }

    .result {
        background-color: #f2f2f2;
        border-radius: 6px;
        padding: 20px;
        font-size: 20px;
        font-weight: bold;
        color: #333;
        margin: 20px 0;
    }

    button {
        width: 100%;
        background-color: #4CAF50;
        color: white;
        padding: 14px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover { background-color: #45a049; }

    .updated {
        margin-top: 16px;
        font-size: 11px;
        color: #999;
    }
</style>
<body>
<div class="card">
    <h3 th:text="${Title}"></h3>

    <span th:if="${usingLiveRates == 'true'}" class="badge live">● Live Rates</span>
    <span th:unless="${usingLiveRates == 'true'}" class="badge cached">⚠ Using Cached Rates</span>

    <div class="result">
        <span th:text="${convertedCurrencies}">result</span>
    </div>

    <form method="get" action="/currency-converter">
        <button type="submit">Convert Again</button>
    </form>

    <p class="updated" th:text="'Rates last updated: ' + ${lastUpdated}"></p>
</div>
</body>
</html>
